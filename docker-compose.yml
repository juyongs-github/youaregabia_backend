services:
  db:
    image: mysql:8.0
    container_name: music-db
    restart: always
    environment:
      MYSQL_DATABASE: appdb
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./music
      dockerfile: Dockerfile
    container_name: music-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      python-vector:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AES_SECRET_KEY: ${AES_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      SWEETTRACKER_API_KEY: ${SWEETTRACKER_API_KEY}
      COOLSMS_API_KEY: ${COOLSMS_API_KEY}
      COOLSMS_API_SECRET: ${COOLSMS_API_SECRET}
      COOLSMS_FROM_NUMBER: ${COOLSMS_FROM_NUMBER}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      VECTOR_SERVICE_URL: ${VECTOR_SERVICE_URL}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ADMIN_CONTACT_EMAIL: ${ADMIN_CONTACT_EMAIL}
      INQUIRY_SCHEDULER_CRON: ${INQUIRY_SCHEDULER_CRON}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
    volumes:
      - uploads:/home/deploy/uploads
    ports:
      - "8080:8080"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: music-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  python-vector:
    build:
      context: ./python-vector
      dockerfile: Dockerfile
    container_name: music-python-vector
    restart: always
    environment:
      VECTOR_DATA_DIR: /app/data
    ports:
      - "8001:8001"
    volumes:
      - python-vector-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../../frontend/youaregabia_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_TOSS_CLIENT_KEY: ${VITE_TOSS_CLIENT_KEY}
    container_name: music-front
    restart: always
    ports:
      - "3000:80"

volumes:
  mysql-data:
  uploads:
  qdrant-data:
  python-vector-data:
